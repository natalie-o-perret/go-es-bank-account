---
name: ci

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - run: go mod download
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
